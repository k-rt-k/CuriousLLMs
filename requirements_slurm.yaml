name: fmg-slurm
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Local training + sampling backend
      - vllm>=0.6.3,<0.8        # OpenAI-compatible LoRA server (load_lora_adapter stable in 0.6.3)
      - peft>=0.13
      - accelerate>=0.34
      - bitsandbytes>=0.43
      - flash-attn>=2.6         # optional but recommended; install with --no-build-isolation
      - httpx>=0.27
      - sentencepiece
      - protobuf

      # Kept from the original Tinker stack — used as data types only.
      # tinker provides ModelInput / Datum / SamplingParams / SampleResponse /
      # SampledSequence / AdamParams / ForwardBackwardOutput / TensorData,
      # all of which tinker-cookbook constructs and our LocalSamplingClient/
      # LocalTrainingClient consume.
      - tinker>=0.11.0

      # ML infrastructure already present in `fmg`
      - torch==2.9.1
      - transformers>=4.57
      - datasets
      - numpy
      - wandb
      - tqdm
      - rich
      - chz==0.3.0

      # tinker-cookbook deps
      - blobfile
      - universal_pathlib
      - jsonlines
      - tenacity
      - psutil
      - aiobotocore
      - aioboto3
      - s3fs

      # Eval / scoring
      - math-verify==0.8.0
      - latex2sympy2_extended==1.10.2
      - inspect_ai

      # Optional reasoning judge (kept from the Gemini judge path)
      - google-genai
      - google-api-core

      - dotenv==0.9.9

# Setup instructions:
#
#   micromamba create -n fmg-slurm -f requirements_slurm.yaml
#   micromamba activate fmg-slurm
#   pip install flash-attn --no-build-isolation   # if not already
#
# Or, to extend the existing `fmg` env (most deps already present there):
#
#   ~/micromamba/envs/fmg/bin/pip install "vllm>=0.6.3,<0.8"
#
# The tinker-cookbook git submodule must be initialized:
#
#   git submodule update --init --recursive
